<style>

  --card:#ffffff;
  --ink:#0f172a;
  --ink-soft:#334155;
  --mute:#64748b;
  --pri:#4f46e5;
  --pri-light:#6366f1;
  --pri-dark:#3730a3;
  --pri-bg:#eef2ff;
  --line:#e2e8f0;
  --danger:#ef4444;
  --danger-bg:#fef2f2;
  --ok:#10b981;
  --ok-bg:#ecfdf5;
  --warn:#f59e0b;
  --warn-bg:#fffbeb;
  --radius-sm:8px;
  --radius-md:12px;

  --radius-xl:20px;

}

*{box-sizing:border-box}
body{
  margin:0;
  font:13.5px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  background-color:var(--bg);
  background-image:radial-gradient(#cbd5e1 0.75px,transparent 0.75px);
  background-size:24px 24px;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  padding-bottom:80px;
}

/* Master Prototype Navigation Bar */
.proto-nav{
  background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 100%);
  color:#fff;
  padding:12px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 4px 20px rgba(0,0,0,0.25);
  position:sticky;
  top:0;
  z-index:900;
  backdrop-filter:blur(8px);
  flex-wrap:wrap;
  gap:12px;
}
.proto-brand{
  display:flex;
  align-items:center;
  gap:12px;
}
.proto-title{
  font-weight:800;
  font-size:15px;
  letter-spacing:-0.2px;
}
.proto-tag{
  background:rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.25);
  padding:2px 8px;
  border-radius:12px;
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.proto-controls{
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
.doc-pill-group, .view-mode-group{
  display:flex;
  background:rgba(255,255,255,0.08);
  padding:3px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.12);
}
.proto-tab{
  background:transparent;
  border:0;
  color:#cbd5e1;
  padding:6px 14px;
  font-size:12.5px;
  font-weight:600;
  border-radius:7px;
  cursor:pointer;
  transition:all 0.15s ease;
  font-family:inherit;
  display:flex;
  align-items:center;
  gap:6px;
}
.proto-tab.active{
  background:#4f46e5;
  color:#ffffff;
  box-shadow:0 2px 8px rgba(79,70,229,0.5);
}
.proto-tab:hover:not(.active){
  background:rgba(255,255,255,0.12);
  color:#fff;
}

/* Page Container */
.container{
  max-width:1440px;
  margin:20px auto;
  padding:0 20px;
}

/* Common Buttons */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  background:linear-gradient(135deg,var(--pri),var(--pri-light));
  color:#ffffff;
  border:0;
  padding:8px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
  font-size:13px;
  box-shadow:0 2px 6px rgba(79,70,229,0.25);
  transition:all 0.15s ease;
  font-family:inherit;
}
.btn:hover{
  background:linear-gradient(135deg,var(--pri-dark),var(--pri));
  box-shadow:0 4px 12px rgba(79,70,229,0.35);
  transform:translateY(-1px);
}
.btn.ghost{
  background:#ffffff;
  color:#475569;
  border:1px solid #cbd5e1;
  box-shadow:var(--shadow-sm);
}
.btn.ghost:hover{
  background:#f8fafc;
  border-color:#94a3b8;
  color:#1e293b;
}
.btn.red{
  background:var(--danger-bg);
  color:var(--danger);
  border:1px solid rgba(239,68,68,0.2);
  box-shadow:none;
}
.btn.red:hover{
  background:#fee2e2;
  color:#b91c1c;
}
.btn.sm{
  padding:4px 9px;
  font-size:11.5px;
  border-radius:6px;
}

/* Card Styling */
.card{
  background:var(--card);
  border-radius:var(--radius-md);
  padding:18px 20px;
  border:1px solid var(--line);
  box-shadow:var(--shadow-sm);
  margin-bottom:16px;
}

/* ========================================================= */

  align-items:center;

}
.inv-kpi-card:hover{

  transform:translateY(-1px);
}
.inv-kpi-val{
  font-size:20px;
  font-weight:800;
  font-family:'JetBrains Mono',monospace;
  color:var(--ink);
  line-height:1.2;
}
.inv-kpi-lbl{
  font-size:11px;
  color:var(--mute);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.5px;
  margin-top:3px;
}
.inv-kpi-icon{

  height:38px;
  border-radius:10px;

  align-items:center;
  justify-content:center;

  flex-shrink:0;
}
.inv-toolbar{

  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
}
.inv-search-wrap{

}
.inv-search-wrap span{

.inv-search-input{

.inv-filter-pill{

.inv-filter-pill.active{

.inv-table-compact tbody tr:hover{

  font-weight:700;

  padding:2px 7px;

}

  border:none;
  color:#94a3b8;

  padding:0;
  font-size:11px;
  line-height:1;
}
.inv-num-pill .copy-icon:hover{
  color:#4f46e5;
}
.inv-client-box{
  display:flex;
  align-items:center;
  gap:8px;
}
.inv-client-avatar{

  height:26px;
  border-radius:6px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:11px;
  flex-shrink:0;
}
.inv-tax-tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:11.5px;
  padding:2px 7px;
  border-radius:6px;
  font-weight:600;
  white-space:nowrap;
}
.inv-tax-tag.instate{
  background:#ecfdf5;
  color:#065f46;
  border:1px solid #a7f3d0;
}
.inv-tax-tag.igst{
  background:#fffbeb;
  color:#92400e;
  border:1px solid #fde68a;
}
.inv-user-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:11.5px;
  color:#475569;
  background:#f8fafc;
  padding:2px 7px;
  border-radius:10px;
  border:1px solid #e2e8f0;
}

/* ========================================================= */
/* === VIEW 2: SPLIT-VIEW BUILDER WORKSPACE STYLES === */
/* ========================================================= */
.split-builder-layout{
  display:grid;
  grid-template-columns:1.15fr 1fr;
  gap:22px;
  align-items:start;
}
@media(max-width:1250px){
  .split-builder-layout{grid-template-columns:1fr}
}
.split-form-col{
  min-width:0;
}
.split-form-col .card{
  padding:18px 20px;
  margin-bottom:14px;
}
.form-section-title{
  font-size:11.5px;
  font-weight:700;
  color:var(--mute);
  text-transform:uppercase;
  letter-spacing:0.5px;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:6px;
}
.grid-2{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:12px;
}
.grid-3{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
}
label{
  display:block;
  font-size:11.5px;
  color:var(--mute);
  margin-bottom:4px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.03em;
}
input,select,textarea{
  width:100%;
  font-family:inherit;
  font-size:13px;
  padding:8px 10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:var(--ink);
  transition:all 0.15s ease;
}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:#6366f1;
  box-shadow:0 0 0 3px rgba(99,102,241,0.12);
}

/* Dynamic Line Items Table */
.builder-items-table{
  width:100%;
  border-collapse:collapse;
  font-size:12.5px;
  margin-top:6px;
}
.builder-items-table th{
  background:#f8fafc;
  color:var(--mute);
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  padding:8px 8px;
  border-bottom:1px solid var(--line);
  text-align:left;
}
.builder-items-table th.n{text-align:right}
.builder-items-table td{
  padding:6px 6px;
  border-bottom:1px solid #f1f5f9;
  vertical-align:middle;
}
.builder-items-table td.n{text-align:right}
.builder-items-table input,.builder-items-table textarea{
  padding:5px 8px;
  font-size:12.5px;
}

/* Right Sticky Live Preview Column */
.split-preview-col{
  position:sticky;
  top:70px;
  background:#0f172a;
  border:1px solid #334155;
  border-radius:12px;
  padding:12px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,0.25);
  min-width:0;
}
.split-preview-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  color:#cbd5e1;
  font-size:11.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.split-preview-header .live-badge{
  background:#10b981;
  color:#ffffff;
  padding:2px 7px;
  border-radius:4px;
  font-size:10px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.split-preview-header .live-badge::before{
  content:'';
  width:6px;
  height:6px;
  background:#fff;
  border-radius:50%;
  display:inline-block;
  animation:pulseDot 1.5s infinite;
}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:0.3}}
.split-preview-sheet{
  background:#ffffff;
  border-radius:6px;
  padding:16px;
  box-shadow:0 4px 16px rgba(0,0,0,0.35);
  max-height:calc(100vh - 130px);
  overflow-y:auto;
}

  tbody.innerHTML = builderState.items.map((row, idx) => `
    <tr>
      <td>
        <textarea rows="1" style="min-width:180px" oninput="builderState.items[${idx}].desc=this.value;updateLiveDocument()">${row.desc||''}</textarea>
      </td>
      <td>
        <input type="number" min="1" value="${row.qty||1}" style="width:60px" oninput="builderState.items[${idx}].qty=+this.value||0;calcBuilder();updateLiveDocument()">
      </td>
      ${!isQ ? `
        <td>
          <input type="text" value="${row.uom||'Nos'}" style="width:55px" oninput="builderState.items[${idx}].uom=this.value;updateLiveDocument()">

  calcBuilder();
  renderBuilderRows();
  updateLiveDocument();
}

function removeBuilderRow(idx) {
  if (builderState.items.length <= 1) {
    alert('At least one line item is required.');
    return;
  }
  builderState.items.splice(idx, 1);
  calcBuilder();
  renderBuilderRows();
  updateLiveDocument();
}

function calcBuilder() {
  let subtotal = 0;
  builderState.items.forEach((it, idx) => {
    const qty = +it.qty || 0;
    const rate = +it.rate || 0;
    const disc = +it.disc || 0;
    const pf = +it.pf || 0;
    const amt = (qty * rate * (1 - disc / 100)) + pf;
    it.amount = amt;
    subtotal += amt;
    const el = document.getElementById(`itemAmt_${idx}`);
    if (el) el.textContent = `₹${amt.toFixed(2)}`;
  });

  builderState.subtotal = subtotal;
  let taxAmt = 0;
  if (curDocType !== 'quotation' && builderState.taxType !== 'NONE') {
    taxAmt = subtotal * (builderState.taxRate || 18) / 100;
  }
  builderState.taxAmount = taxAmt;
  builderState.payable = subtotal + taxAmt;
  builderState.total = builderState.payable;

  const box = document.getElementById('builderTotalsBox');
  if (box) {
    if (curDocType === 'quotation') {
      box.innerHTML = `
        <div style="font-size:12px;color:var(--mute)">Subtotal: <strong>${inr(subtotal)}</strong></div>
        <div style="font-size:16px;font-weight:800;color:#0f172a;margin-top:2px">Grand Total: ${inr(subtotal)}</div>
      `;
    } else {
      box.innerHTML = `
        <div style="font-size:12px;color:var(--mute)">Subtotal: <strong>${inr(subtotal)}</strong></div>
        <div style="font-size:12px;color:var(--mute);margin:2px 0">Tax (${builderState.taxType}): <strong>${inr(taxAmt)}</strong></div>
        <div style="font-size:16px;font-weight:800;color:#4338ca;margin-top:4px">Payable Amount: ${inr(builderState.payable)}</div>
      `;
    }
  }
}

function updateLiveDocument() {
  calcBuilder();
  const container = document.getElementById('liveSheetContainer');
  if (!container) return;

  if (curDocType === 'quotation') {
    container.innerHTML = generateLiveQuotationHTML(builderState);
  } else if (curDocType === 'pi') {
    container.innerHTML = generateLivePpHTML(builderState, 'pi');
  } else if (curDocType === 'po') {
    container.innerHTML = generateLivePpHTML(builderState, 'po');
  }
}

// =========================================================
// DOCUMENT HTML GENERATORS (Authentic DCSS Letterhead)

function generateLiveQuotationHTML(d) {

      <td class="c">${String(i + 1).padStart(2, '0')}</td>
      <td>${nl(x.desc)}</td>
      <td class="c">${x.qty}</td>
      <td class="r">${(+x.rate||0).toFixed(2)}</td>
      <td class="r">${(+x.amount||0).toFixed(2)}</td>

  const terms = String(d.terms || '').split('\n').filter(x => x.trim()).map((t, i) => `
    <div class="qtm">${i + 1})&nbsp;&nbsp;${t}</div>
  `).join('');

  const sg = String(d.sign || '').split('\n').map((l, i) => i < 3 ? `<b>${l}</b>` : l).join('<br>');

  return `
    <div class="dd qq">
      <!-- Header -->
      <table>
        <tr>
          <td style="width:25%"><div style="font-size:24px;font-weight:bold;color:#4338ca">AMIGO</div></td>
          <td><div class="qh">${nl(co.quoteHeader)}</div></td>
        </tr>
      </table>
      <div class="rl"></div>

      <div class="qt">QUOTATION</div>

      <table class="qd">
        <tr>
          <td class="f">To,</td>
          <td class="r">Date – &nbsp;${d.date}</td>
        </tr>
      </table>
      <div style="height:6px"></div>
      <table class="qd">
        <tr>
          <td class="f" style="padding-left:14px">M/s <b>${d.toName}</b></td>
          <td class="r" style="font-size:11.5px">Quotation No. – ${d.number}</td>
        </tr>
      </table>
      <div style="height:8px"></div>
      ${d.attn ? `<div class="qn">Kind Attend – <b>${d.attn}</b></div>` : ''}
      ${d.ref ? `<div class="qn">Ref.- ${d.ref}</div>` : ''}
      ${d.subject ? `<div class="qn">Sub.- <b>${d.subject}</b></div>` : ''}
      <div class="qn">Dear sir,</div>
      <div class="qn" style="margin:0 0 12px 0;text-indent:24px;text-align:justify">${d.intro || ''}</div>

      <!-- Items Table -->
      <table class="qi">
        <thead>
          <tr>
            <th style="width:9%">Sr. No.</th>
            <th>Description</th>
            <th style="width:8%">Qty</th>
            <th style="width:18%" class="r">Rate/Unit</th>
            <th style="width:18%" class="r">Total (₹)</th>
          </tr>
        </thead>
        <tbody>
          ${rows}
          <tr style="height:32px;background:#f8f9fa">
            <td colspan="4" class="r" style="font-weight:bold">TOTAL (₹)</td>
            <td class="r" style="font-weight:bold">${(+d.subtotal||0).toFixed(2)}</td>
          </tr>
        </tbody>
      </table>

      <!-- Terms & Signature -->
      <div class="qtc">Terms &amp; Conditions</div>
      ${terms}

      <div class="qy">Your Faithfully,</div>
      <div class="qs">${sg}</div>
    </div>
  `;
}

function generateLivePpHTML(d, type) {
  const isPI = type === 'pi';
  const nl = s => (s||'').replace(/\n/g, '<br>');
  const it = d.items;
  const tax = d.taxType === 'NONE' ? '' : (d.taxType === 'IGST' ? `IGST ${d.taxRate}%` : `CGST ${d.taxRate/2}% + SGST ${d.taxRate/2}%`);

  const left = `
    <table>
      <tr>
        <td style="width:32%"><div style="font-size:22px;font-weight:bold;color:#1e40af">AMIGO</div></td>
        <td style="padding-left:8px;font:bold 10px Arial,sans-serif;line-height:1.3">${co.name}<br><span style="font-weight:normal">${nl(co.docAddress)}</span></td>
      </tr>
    </table>
    <div class="cbox">${isPI ? 'Contact Person: ' : 'Buyers contact '}${co.contactPhone}<br>Buyer Email: ${co.contactEmail}</div>
  `;

  const mid = isPI ? `
    <b>To,</b><br>
    <b style="font-size:12px">${d.toName}</b><br>
    <b>${nl(d.toAddress||'')}</b><br><br>
    ${d.toGstin ? `<b>GSTIN : </b>${d.toGstin}<br>` : ''}
    ${d.toContact ? `<b>Contact person : </b>${d.toContact}<br>` : ''}
    ${d.toPhone ? `<b>Phone : </b>${d.toPhone}` : ''}
  ` : `
    <div style="font-size:12px">To,<br><b>&nbsp;&nbsp;${d.toName}</b><br>${nl(d.toAddress||'')}<br><br>
    ${d.toGstin ? `GST- ${d.toGstin}<br>` : ''}
    ${d.toContact ? `Contact Person - ${d.toContact}<br>` : ''}
    ${d.toPhone ? `Contact number - ${d.toPhone}` : ''}</div>
  `;

  const right = isPI ? `
    Proforma Invoice No.<br><b>${d.number}</b><br><br>
    Date : ${d.date}<br><br>
    You’re Pur. Order No.<br><b>${d.poNo||'—'}</b><br>
    Date: ${d.poDate||'—'}
  ` : `
    <b>Po No. P.O: ${d.number}</b><br><br>
    <b>Date: ${d.date}</b>
  `;

  const body = it.map((x, i) => `
    <tr>
      <td class="c">${String(i + 1).padStart(2, '0')}</td>
      <td class="ds">${nl(x.desc)}</td>
      <td class="c b">${x.qty}</td>
      <td class="c b">${x.uom||'Nos'}</td>
      <td class="c b">${(+x.rate||0).toFixed(2)}</td>
      <td class="c">${x.disc||0}%</td>
      <td class="c">${x.pf||0}</td>
      <td class="b bp r">${(+x.amount||0).toFixed(2)}</td>
      <td class="c">${x.delivery||'As earliest'}</td>
    </tr>
  `).join('');

  return `
    <div class="dd ${type}">
      <div class="ttl" style="${isPI ? 'font:bold 22px Times New Roman;color:#2e74b5;text-decoration:underline' : 'font:bold 22px Arial;color:#5b9bd5'}">
        ${isPI ? 'PROFORMA INVOICE' : 'PURCHASE ORDER'}
      </div>

      <table class="pph">
        <tr>
          <td class="h f" style="width:40%">${left}</td>
          <td class="h" style="width:34%">${mid}</td>
          <td class="h" style="width:26%">${right}</td>
        </tr>
      </table>

      <div style="height:14px"></div>

      <table class="itm">
        <thead>
          <tr>
            <th style="width:6%">SR.</th>
            <th style="width:30%">Description</th>
            <th style="width:8%">Qty</th>
            <th style="width:8%">UOM</th>
            <th style="width:11%">Unit Price</th>
            <th style="width:6%">Disc</th>
            <th style="width:6%">P&amp;F</th>
            <th style="width:13%" class="r">Base Price</th>
            <th style="width:12%">Delivery</th>
          </tr>
        </thead>
        <tbody>
          ${body}
          <tr style="background:#fafafa">
            <td colspan="2" class="tl"></td>
            <td colspan="5" class="tl b">SUBTOTAL</td>
            <td class="tl b bp r">${(+d.subtotal||0).toFixed(2)}</td>
            <td class="tl"></td>
          </tr>
          ${tax ? `
            <tr style="background:#fafafa">
              <td colspan="2" class="tl"></td>
              <td colspan="5" class="tl b">Tax Rate Input (${tax})</td>
              <td class="tl b bp r">${(+d.taxAmount||0).toFixed(2)}</td>
              <td class="tl"></td>
            </tr>
          ` : ''}
          <tr style="background:#eef2ff;font-weight:bold">
            <td colspan="2" class="tl"></td>
            <td colspan="5" class="tl b" style="color:#1e40af">PAYABLE AMOUNT (INR)</td>
            <td class="tl b bp r" style="color:#1e40af;font-size:13px">${(+d.payable||0).toFixed(2)}</td>
            <td class="tl"></td>
          </tr>
        </tbody>
      </table>

      <!-- Footer Details -->
      ${isPI ? `
        <table class="box">
          <tr>
            <td class="bk">
              <div class="bt">BANK DETAILS</div>
              <p>Bank: <b>${co.bankName}</b> &nbsp;&bull;&nbsp; Branch: <b>${co.bankBranch}</b></p>
              <p>A/c. No: <b>${co.bankAcc}</b> &nbsp;&bull;&nbsp; IFSC Code: <b>${co.bankIfsc}</b></p>
              <p>PAN NO: <b>${co.pan}</b> &nbsp;&bull;&nbsp; GST No: <b>${co.gstin}</b></p>
            </td>
          </tr>
        </table>
      ` : `
        <table class="box">
          <tr>
            <td style="padding:6px;font:bold 11px Arial,sans-serif">PAYMENT TERMS: ${d.payment||'100% Against PI'}</td>
          </tr>
        </table>
        <table class="box">
          <tr>
            <td style="padding:6px;font-size:11px">
              Our Tax Details: PAN Number - <b>${co.pan}</b> &bull; GST Number - <b>${co.gstin}</b>
            </td>
          </tr>
        </table>
      `}
    </div>
  `;
}

// Event Handlers
function onSearchChange(val) {
  curSearch = val;
  renderApp();
}

function setDocFilter(f) {
  curFilter = f;
  renderApp();
}

function onSelectParty(id) {
  const p = sampleClients.find(x => x.id == id);
  if (!p) return;
  builderState.partyId = id;
  builderState.toName = p.name;
  builderState.toAddress = p.address;
  builderState.toGstin = p.gstin;
  builderState.toContact = p.contact;
  builderState.toPhone = p.phone;
  if (curDocType === 'quotation') {
    builderState.attn = p.contact;
  }
  renderApp();
  renderBuilderRows();
}

function copyVal(v) {
  navigator.clipboard?.writeText(v);
  alert('Copied ' + v + ' to clipboard');
}

function openDocPreview(id) {
  const list = sampleDocs[curDocType];
  const item = list.find(x => x.id === id);
  if (!item) return;
  alert(`Viewing full document ${item.number} for ${item.party} (Total: ${inr(item.total)})`);
}

function duplicateDoc(id) {
  const list = sampleDocs[curDocType];
  const item = list.find(x => x.id === id);
  if (!item) return;
  alert(`Duplicated ${item.number}. Pre-filled in Split-View Builder!`);
  setViewMode('create');
}

function editDoc(id) {
  alert(`Opening document in Split-View Builder for editing`);
  setViewMode('create');
}

function deleteDoc(id) {
  if (confirm('Delete this record permanently?')) {
    sampleDocs[curDocType] = sampleDocs[curDocType].filter(x => x.id !== id);
    renderApp();
  }
}

function saveNewDoc() {
  const meta = DOC_META[curDocType];
  sampleDocs[curDocType].unshift({
    id: 'new_' + Date.now(),
    type: curDocType,
    number: builderState.number,
    date: builderState.date,
    party: builderState.toName,
    total: builderState.total,
    createdBy: 'admin',
    itemsCount: builderState.items.length,
    taxType: builderState.taxType,
    sub: builderState.subject
  });
  alert(`✅ ${meta.name} ${builderState.number} saved successfully!`);
  setViewMode('list');
}

function exportExcel() {
  const list = sampleDocs[curDocType];
  const meta = DOC_META[curDocType];
  const data = list.map(r => ({
    'Number': r.number,
    'Date': r.date,
    [meta.partyLabel]: r.party,
    'Total Amount': r.total,
    'Created By': r.createdBy
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, meta.plural);
  XLSX.writeFile(wb, `${meta.plural}_Register.xlsx`);
}

// Initial Boot
initBuilderState();
renderApp();
if (curViewMode === 'create') renderBuilderRows();
</script>
